<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="../estilo.css">
<style>
  .embreve { position: relative; z-index: 1; max-width: 34rem; margin: 0 auto; text-align: center;

<div class="pergaminho" aria-hidden="true"></div>

  <p>O jogo de escolhas baseado no livro <em>Carmen</em> está sendo preparado e será lançado em breve. Acompanhe as novidades no Instagram.</p>
  <div class="acoes">
    <a class="botao principal" href="https://www.instagram.com/omatheusleone/" target="_blank" rel="noopener">@omatheusleone</a>
