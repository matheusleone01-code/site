<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carmen · Versão completa</title>
<meta name="description" content="Versão completa (com spoilers) do jogo de escolhas do livro Carmen, de Matheus Leone, para quem já terminou o livro.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="../estilo.css">
<link rel="stylesheet" href="jogo.css">
</head>
<body class="jogo">
<div class="pergaminho" aria-hidden="true"></div>
<header class="barra">
  <div class="barra-dentro">
    <a class="voltar" href="../">← Site</a>
    <span class="rotulo-arco" id="rotulo-arco" aria-live="polite"></span>
    <button class="botao-fichas" id="botao-fichas" type="button">Fichas</button>
  </div>
</header>

<main class="palco" id="palco"></main>

<dialog class="painel" id="painel-fichas" aria-labelledby="titulo-fichas">
  <div class="painel-dentro">
    <div class="painel-topo">
      <h2 id="titulo-fichas">Fichas</h2>
      <button class="botao" id="fechar-fichas" type="button">Fechar</button>
    </div>
    <p class="painel-dica">Novos personagens ganham ficha quando cruzam o caminho de Carmen. Leia com atenção: as pistas estão aqui.</p>
    <ul class="lista-fichas" id="lista-fichas"></ul>
  </div>
</dialog>

<script src="cenas-completo.js"></script>
<script src="codigo.js"></script>
<script src="jogo.js"></script>
</body>
</html>
